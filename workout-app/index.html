<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0d0d0d">
  <title>Weekly Workout</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0d;
      --card: #1a1a1a;
      --border: #2a2a2a;
      --accent: #FF6B35;
      --accent-dim: rgba(255, 107, 53, 0.12);
      --text: #ffffff;
      --muted: #777777;
      --success: #34c759;
      --radius: 14px;
      --top: env(safe-area-inset-top, 20px);
      --bottom: env(safe-area-inset-bottom, 0px);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .hidden { display: none !important; }

    /* ── SETUP SCREEN ── */
    #setup-screen {
      max-width: 480px;
      margin: 0 auto;
      padding: max(var(--top), 48px) 22px calc(var(--bottom) + 32px);
    }

    .app-eyebrow {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .app-title {
      font-size: 32px;
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 6px;
    }

    .app-subtitle {
      color: var(--muted);
      font-size: 15px;
      margin-bottom: 40px;
    }

    .section { margin-bottom: 32px; }

    .section-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .option {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 100px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, color 0.15s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .option.selected {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: var(--accent);
    }

    .option:active { opacity: 0.75; }

    .energy-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .energy-option {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 10px 14px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .energy-option .e-emoji { font-size: 26px; display: block; margin-bottom: 7px; }
    .energy-option .e-label { font-size: 14px; font-weight: 700; }
    .energy-option .e-desc { font-size: 11px; color: var(--muted); margin-top: 3px; }

    .energy-option.selected {
      background: var(--accent-dim);
      border-color: var(--accent);
    }
    .energy-option.selected .e-label { color: var(--accent); }

    .generate-btn {
      width: 100%;
      padding: 18px;
      background: var(--accent);
      border: none;
      border-radius: var(--radius);
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
      margin-top: 8px;
    }

    .generate-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .generate-btn:not(:disabled):active { transform: scale(0.98); opacity: 0.9; }

    /* ── PLAN SCREEN ── */
    #plan-screen {
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
    }

    .plan-header {
      padding: max(var(--top), 20px) 22px 0;
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .plan-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .plan-title { font-size: 24px; font-weight: 800; }

    .header-actions { display: flex; gap: 8px; }

    .ghost-btn {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.15s;
    }
    .ghost-btn:active { opacity: 0.65; }

    /* Day tabs */
    .day-tabs {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 14px;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .day-tabs::-webkit-scrollbar { display: none; }

    .day-tab {
      flex-shrink: 0;
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 9px 14px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      min-width: 64px;
    }

    .day-tab .t-day {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .day-tab .t-name {
      font-size: 12px;
      font-weight: 600;
      margin-top: 3px;
      white-space: nowrap;
    }

    .day-tab.active {
      background: var(--accent-dim);
      border-color: var(--accent);
    }
    .day-tab.active .t-day,
    .day-tab.active .t-name { color: var(--accent); }
    .day-tab.rest .t-name { color: var(--muted); }

    /* Plan content */
    .plan-content {
      padding: 20px 22px calc(var(--bottom) + 28px);
      flex: 1;
    }

    .day-header { margin-bottom: 20px; }
    .day-heading { font-size: 26px; font-weight: 800; margin-bottom: 3px; }
    .day-subheading { font-size: 14px; font-weight: 600; color: var(--accent); }

    /* Rest card */
    .rest-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 48px 24px;
      text-align: center;
    }
    .rest-emoji { font-size: 52px; display: block; margin-bottom: 14px; }
    .rest-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    .rest-desc { font-size: 14px; color: var(--muted); line-height: 1.5; }

    /* Exercise cards */
    .exercise-list { display: flex; flex-direction: column; gap: 10px; }

    .exercise-card {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 15px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .exercise-card:active { opacity: 0.8; }

    .exercise-card.swapped {
      border-color: var(--success);
      background: rgba(52, 199, 89, 0.06);
    }

    .ex-info { flex: 1; min-width: 0; }
    .ex-name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ex-muscles { font-size: 12px; color: var(--muted); margin-top: 3px; }

    .ex-meta { text-align: right; flex-shrink: 0; }
    .ex-sets { font-size: 16px; font-weight: 800; color: var(--accent); }
    .ex-reps { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .swap-icon { color: var(--muted); font-size: 17px; flex-shrink: 0; }

    .swap-hint {
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      margin-bottom: 16px;
    }

    /* ── SWAP SHEET ── */
    .swap-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 100;
      display: flex;
      align-items: flex-end;
    }

    .swap-sheet {
      background: #1c1c1e;
      border-radius: 22px 22px 0 0;
      padding: 6px 22px calc(var(--bottom) + 24px);
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      animation: slideUp 0.28s cubic-bezier(0.32,0.72,0,1);
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to   { transform: translateY(0); }
    }

    .sheet-handle {
      width: 36px;
      height: 4px;
      background: #3a3a3c;
      border-radius: 2px;
      margin: 10px auto 20px;
    }

    .sheet-title { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
    .sheet-subtitle { font-size: 13px; color: var(--muted); margin-bottom: 16px; }

    .sheet-current {
      background: var(--bg);
      border-radius: 10px;
      padding: 11px 14px;
      margin-bottom: 18px;
    }
    .sheet-current-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 3px;
    }
    .sheet-current-name { font-size: 15px; font-weight: 600; }

    .swap-options { display: flex; flex-direction: column; gap: 10px; }

    .swap-option {
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 15px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: border-color 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .swap-option:active { border-color: var(--accent); opacity: 0.85; }

    .so-name { font-size: 15px; font-weight: 600; }
    .so-muscles { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .so-meta { text-align: right; }
    .so-sets { font-size: 15px; font-weight: 800; color: var(--accent); }
    .so-reps { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .no-alts { font-size: 14px; color: var(--muted); text-align: center; padding: 24px 0; }
  </style>
</head>
<body>

<!-- ══ SETUP SCREEN ══ -->
<div id="setup-screen">
  <div class="app-eyebrow">Plan Builder</div>
  <div class="app-title">Weekly<br>Workout</div>
  <div class="app-subtitle">Personalised to you, every week</div>

  <div class="section">
    <div class="section-label">Your Goal</div>
    <div class="options" id="goal-options">
      <button class="option" data-value="strength">Strength</button>
      <button class="option" data-value="fatLoss">Fat Loss</button>
      <button class="option" data-value="endurance">Endurance</button>
      <button class="option" data-value="generalFitness">General Fitness</button>
      <button class="option" data-value="flexibility">Flexibility</button>
    </div>
  </div>

  <div class="section">
    <div class="section-label">Available Equipment</div>
    <div class="options" id="equipment-options">
      <button class="option" data-value="bodyweight">Bodyweight Only</button>
      <button class="option" data-value="dumbbells">Dumbbells</button>
      <button class="option" data-value="gym">Full Gym</button>
    </div>
  </div>

  <div class="section">
    <div class="section-label">Energy Level This Week</div>
    <div class="energy-options">
      <div class="energy-option" data-value="low">
        <span class="e-emoji">😴</span>
        <div class="e-label">Low</div>
        <div class="e-desc">Take it easy</div>
      </div>
      <div class="energy-option" data-value="medium">
        <span class="e-emoji">💪</span>
        <div class="e-label">Medium</div>
        <div class="e-desc">Standard week</div>
      </div>
      <div class="energy-option" data-value="high">
        <span class="e-emoji">🔥</span>
        <div class="e-label">High</div>
        <div class="e-desc">Push hard</div>
      </div>
    </div>
  </div>

  <button class="generate-btn" id="generate-btn" disabled>Generate My Plan</button>
</div>

<!-- ══ PLAN SCREEN ══ -->
<div id="plan-screen" class="hidden">
  <div class="plan-header">
    <div class="plan-header-row">
      <div class="plan-title">Your Plan</div>
      <div class="header-actions">
        <button class="ghost-btn" id="back-btn">← Setup</button>
        <button class="ghost-btn" id="regen-btn">Regenerate</button>
      </div>
    </div>
    <div class="day-tabs" id="day-tabs"></div>
  </div>
  <div class="plan-content" id="plan-content"></div>
</div>

<!-- ══ SWAP SHEET ══ -->
<div class="swap-overlay hidden" id="swap-overlay">
  <div class="swap-sheet" id="swap-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Swap Exercise</div>
    <div class="sheet-subtitle">Pick an alternative</div>
    <div class="sheet-current">
      <div class="sheet-current-label">Replacing</div>
      <div class="sheet-current-name" id="sheet-current-name"></div>
    </div>
    <div class="swap-options" id="swap-options"></div>
  </div>
</div>

// ══════════════════════════════════════════
// UTILITIES
// ══════════════════════════════════════════
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function equipmentTier(tier) {
  return { bodyweight:['bodyweight'], dumbbells:['bodyweight','dumbbells'], gym:['bodyweight','dumbbells','gym'] }[tier] || ['bodyweight'];
}

function pickExercises(category, equipment, count, excludeIds = []) {
  const allowed = equipmentTier(equipment);
  const pool = EXERCISES.filter(e =>
    e.category === category &&
    allowed.includes(e.equipment) &&
    !excludeIds.includes(e.id)
  );
  return shuffle(pool).slice(0, count);
}

function applyEnergy(ex, energy) {
  const e = { ...ex };
  if (energy === 'low')  e.sets = Math.max(1, Math.round(e.sets * 0.67));
  if (energy === 'high') e.sets = Math.round(e.sets * 1.33);
  e.swapped = false;
  return e;
}

// ══════════════════════════════════════════
// PLAN GENERATION
// ══════════════════════════════════════════
function generatePlan(goal, equipment, energy) {
  return PLAN_TEMPLATES[goal].map(tmpl => {
    if (tmpl.isRest) return { ...tmpl, exercises: [] };
    const usedIds = [];
    const exercises = [];
    Object.entries(tmpl.plan).forEach(([cat, count]) => {
      pickExercises(cat, equipment, count, usedIds).forEach(ex => {
        usedIds.push(ex.id);
        exercises.push(applyEnergy(ex, energy));
      });
    });
    return { ...tmpl, exercises };
  });
}

// ══════════════════════════════════════════
// STATE
// ══════════════════════════════════════════
let state = { goal: null, equipment: null, energy: null, plan: null, activeDay: 0, swapTarget: null };
let _swapAlts = [];

function saveState() {
  try { localStorage.setItem('wp_v1', JSON.stringify(state)); } catch(e) {}
}

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem('wp_v1'));
    if (s && s.plan) { state = s; return true; }
  } catch(e) {}
  return false;
}

// ══════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════
function showSetup() {
  document.getElementById('setup-screen').classList.remove('hidden');
  document.getElementById('plan-screen').classList.add('hidden');
  syncSetupUI();
}

function showPlan() {
  document.getElementById('setup-screen').classList.add('hidden');
  document.getElementById('plan-screen').classList.remove('hidden');
  renderTabs();
  renderDay();
}

function syncSetupUI() {
  document.querySelectorAll('#goal-options .option').forEach(b =>
    b.classList.toggle('selected', b.dataset.value === state.goal));
  document.querySelectorAll('#equipment-options .option').forEach(b =>
    b.classList.toggle('selected', b.dataset.value === state.equipment));
  document.querySelectorAll('.energy-option').forEach(b =>
    b.classList.toggle('selected', b.dataset.value === state.energy));
  updateGenerateBtn();
}

function updateGenerateBtn() {
  document.getElementById('generate-btn').disabled = !(state.goal && state.equipment && state.energy);
}

function renderTabs() {
  document.getElementById('day-tabs').innerHTML = state.plan.map((d, i) => `
    <div class="day-tab ${i === state.activeDay ? 'active' : ''} ${d.isRest ? 'rest' : ''}"
         onclick="switchDay(${i})">
      <div class="t-day">${d.day.slice(0,3)}</div>
      <div class="t-name">${d.isRest ? 'Rest' : d.name}</div>
    </div>
  `).join('');
}

function renderDay() {
  const day = state.plan[state.activeDay];
  const el = document.getElementById('plan-content');

  if (day.isRest) {
    el.innerHTML = `
      <div class="day-header">
        <div class="day-heading">${day.day}</div>
        <div class="day-subheading">Rest Day</div>
      </div>
      <div class="rest-card">
        <span class="rest-emoji">😴</span>
        <div class="rest-title">Rest & Recover</div>
        <div class="rest-desc">Muscles grow during recovery. Hydrate, sleep well, and come back strong tomorrow.</div>
      </div>`;
    return;
  }

  el.innerHTML = `
    <div class="day-header">
      <div class="day-heading">${day.day}</div>
      <div class="day-subheading">${day.name}</div>
    </div>
    <div class="swap-hint">Tap any exercise to swap it</div>
    <div class="exercise-list">
      ${day.exercises.map((ex, i) => `
        <div class="exercise-card${ex.swapped ? ' swapped' : ''}" onclick="openSwap(${state.activeDay},${i})">
          <div class="ex-info">
            <div class="ex-name">${ex.name}</div>
            <div class="ex-muscles">${ex.muscles}</div>
          </div>
          <div class="ex-meta">
            <div class="ex-sets">${ex.sets} sets</div>
            <div class="ex-reps">${ex.reps}</div>
          </div>
          <div class="swap-icon">⇄</div>
        </div>
      `).join('')}
    </div>`;
}

function switchDay(i) {
  state.activeDay = i;
  saveState();
  renderTabs();
  renderDay();
}

// ══════════════════════════════════════════
// SWAP
// ══════════════════════════════════════════
function openSwap(dayIndex, exIndex) {
  state.swapTarget = { dayIndex, exIndex };
  const current = state.plan[dayIndex].exercises[exIndex];
  const dayIds = state.plan[dayIndex].exercises.map(e => e.id);
  const allowed = equipmentTier(state.equipment);

  _swapAlts = shuffle(
    EXERCISES.filter(e =>
      e.category === current.category &&
      allowed.includes(e.equipment) &&
      e.id !== current.id &&
      !dayIds.includes(e.id)
    )
  ).slice(0, 3);

  document.getElementById('sheet-current-name').textContent = current.name;
  document.getElementById('swap-options').innerHTML = _swapAlts.length
    ? _swapAlts.map((alt, i) => {
        const a = applyEnergy(alt, state.energy);
        return `
          <div class="swap-option" onclick="performSwap(${i})">
            <div>
              <div class="so-name">${alt.name}</div>
              <div class="so-muscles">${alt.muscles}</div>
            </div>
            <div class="so-meta">
              <div class="so-sets">${a.sets} sets</div>
              <div class="so-reps">${alt.reps}</div>
            </div>
          </div>`;
      }).join('')
    : '<div class="no-alts">No alternatives available for your equipment.</div>';

  document.getElementById('swap-overlay').classList.remove('hidden');
}

function performSwap(altIndex) {
  const { dayIndex, exIndex } = state.swapTarget;
  const newEx = applyEnergy(_swapAlts[altIndex], state.energy);
  newEx.swapped = true;
  state.plan[dayIndex].exercises[exIndex] = newEx;
  saveState();
  closeSwap();
  renderDay();
}

function closeSwap() {
  document.getElementById('swap-overlay').classList.add('hidden');
  state.swapTarget = null;
  _swapAlts = [];
}

// ══════════════════════════════════════════
// EVENT LISTENERS
// ══════════════════════════════════════════
document.querySelectorAll('#goal-options .option').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#goal-options .option').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');

    updateGenerateBtn();
  });
});

document.querySelectorAll('#equipment-options .option').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#equipment-options .option').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    state.equipment = btn.dataset.value;
    updateGenerateBtn();
  });
});

document.querySelectorAll('.energy-option').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.energy-option').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    state.energy = btn.dataset.value;
    updateGenerateBtn();
  });
});

document.getElementById('generate-btn').addEventListener('click', () => {
  state.plan = generatePlan(state.goal, state.equipment, state.energy);
  state.activeDay = 0;
  saveState();
  showPlan();
});

document.getElementById('back-btn').addEventListener('click', showSetup);

document.getElementById('regen-btn').addEventListener('click', () => {
  state.plan = generatePlan(state.goal, state.equipment, state.energy);
  state.activeDay = 0;
  saveState();
  renderTabs();
  renderDay();
});

document.getElementById('swap-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('swap-overlay')) closeSwap();
});

// ══════════════════════════════════════════
// INIT
// ══════════════════════════════════════════
if (loadState()) {
  syncSetupUI();
  showPlan();
}
